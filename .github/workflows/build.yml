name: Build and Release .deb

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    # base_ref solo viene seteado en el push event cuando el tag se pushea
    # JUNTO con una actualizacion de rama en el mismo `git push` (ej. `git
    # push origin master v1.2.3`), o al crear el release/tag apuntando a
    # master desde la UI de GitHub. Si se pushea el tag solo (`git tag
    # v1.2.3 && git push origin v1.2.3`) con master ya al dia en el remoto,
    # base_ref queda vacio, esta condicion da false y el job se saltea SIN
    # error visible (aparece como "skipped" en Actions). Verificar siempre
    # con `gh run list --workflow=build.yml` despues de taguear.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.event.base_ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev dos2unix rlpr lpr pdftk qrencode imagemagick gnuplot perl python3-jinja2

      - name: Run test suite
        run: bash tests/run_tests.sh

      - name: Build .deb
        run: fakeroot make

      - name: Create GitHub Release with changelog
        uses: softprops/action-gh-release@v1
        with:
          files: magic-utils_*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
